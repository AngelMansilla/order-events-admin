<div class="admin-shell">
  <header class="admin-header">
    <div>
      <p class="eyebrow">Order Events Platform</p>
      <h1>{{ title }}</h1>
    </div>

    <nav class="admin-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>
      <a routerLink="/orders/new" routerLinkActive="active">
        Create order
      </a>
      <a routerLink="/orders/search" routerLinkActive="active">
        Search order
      </a>
    </nav>
  </header>

  <main class="admin-content">
    <router-outlet />
  </main>
</div>
