name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check application types
        run: bunx tsc -p tsconfig.app.json --noEmit

      - name: Check specification types
        run: bunx tsc -p tsconfig.spec.json --noEmit

      - name: Run unit tests
        run: bunx ng test --no-watch --no-progress --browsers=ChromeHeadless

      - name: Build production application
        run: bunx ng build --configuration production
